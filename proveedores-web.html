<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <title>Proveedores web | Novepsa Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body{font-family:Inter,sans-serif;background:#f7f4f2}</style>
</head>
<body class="text-slate-900">
    <script src="js/app-core.js"></script>
    <main class="mx-auto max-w-5xl px-4 py-7">
        <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <div><p class="text-xs font-black uppercase tracking-widest text-rose-500">Integraciones · Roles 1 y 2</p><h1 class="text-3xl font-black">Proveedores web</h1><p class="text-sm text-slate-500">Enlaza cuentas y revisa propuestas de turnos.</p></div>
            <a href="navegacion.html" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-bold">Volver a Navegación</a>
        </header>
        <div class="mb-5 flex gap-2" role="tablist" aria-label="Gestión de proveedores">
            <button id="tab-proposals" type="button" class="rounded-xl bg-rose-500 px-4 py-3 text-sm font-bold text-white" onclick="vendorIntegration.setTab('proposals')">Propuestas</button>
            <button id="tab-links" type="button" class="rounded-xl bg-white px-4 py-3 text-sm font-bold" onclick="vendorIntegration.setTab('links')">Enlaces</button>
        </div>
        <div id="vendor-integration-status" role="status" class="mb-4 text-sm text-slate-600">Cargando…</div>
        <div id="vendor-integration-content"></div>
    </main>
    <script src="js/vendor-integration.js"></script>
</body>
</html>
